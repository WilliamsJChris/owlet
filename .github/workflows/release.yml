name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build owlet.zip
        run: |
          cd custom_components/owlet
          zip -r ../../owlet.zip . -x '*/__pycache__/*' -x '__pycache__/*'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: owlet.zip
          generate_release_notes: true
